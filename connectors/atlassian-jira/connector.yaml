# Jira, as tools.
#
# Jira only. Jira Service Management -- the service desk -- is a separate product with a
# separate licence and a separate REST namespace, and on a self-hosted estate not necessarily
# even the same host. It lives in connectors/atlassian-servicedesk and shares these
# credentials by name, so an installation where both are the same Jira needs the password
# entered once.
#
# Written for a SELF-HOSTED Jira (Data Center or Server), not for *.atlassian.net:
#   - the API is /rest/api/2, not v3
#   - descriptions are Wiki markup, not ADF
#   - authentication is HTTP Basic with a username and a password
#
# Nothing here is personal to one installation. The address is a variable, the account is
# a variable, and the password is looked up by name. Set them like this:
#
#   setx JIRA_URL  https://jira.example.com
#   setx JIRA_USER your.name
#   ... and store the password under the name "jira" in the Shellvis secret store,
#       or set a JIRA_PASSWORD environment variable.

name: atlassian-jira
kind: http
title: Jira
description: >
  Read, search, comment on and create Jira issues. The service desk queues and SLAs are a
  separate product and a separate connector: atlassian-servicedesk.

baseUrl: ${JIRA_URL}

auth:
  scheme: basic
  userVar: JIRA_USER
  secret: JIRA_PASSWORD

tools:
  # ---------------------------------------------------------------- reading

  - name: jira_search
    method: GET
    path: /rest/api/2/search
    effect: read
    preview: jql
    description: >
      Search issues with JQL. For the user's OWN tickets use jira_my_open instead -- it is
      already scoped to the configured account, and a hand-written assignee clause is how a
      question about "my tickets" comes back listing everybody's.
      Two rules that come from real failures on this kind of installation: use
      "statusCategory != Done" rather than a status name, because the status names are
      localised and change per workflow; and use "summary ~ text" rather than
      "summary = text", because a colon in a subject makes an "=" comparison a JQL syntax
      error. Example:
      project = IMIT AND statusCategory != Done ORDER BY priority DESC
    params:
      - name: jql
        in: query
        required: true
        description: The JQL query.
      - name: maxResults
        in: query
        default: "25"
        description: How many issues to return. 25 by default.
      - name: fields
        in: query
        default: "summary,status,priority,assignee,duedate,updated,description"
        description: Which fields to fetch. Fewer fields, faster answer.
    result:
      items: issues
      total: total
      # The key is a link. ${JIRA_URL} is resolved from the configuration before the {…}
      # placeholders are filled from the response, so the package never holds the address.
      line: "[{key}](${JIRA_URL}/browse/{key})  [{fields.status.name}]  {fields.priority.name}  ({fields.assignee.displayName})  title: {fields.summary}  about: {fields.description|220}"
      empty: >
        no issues match that JQL. That is the answer. If it was expected to match, check
        the project key and remember that status names are localised -- use
        statusCategory != Done.

  - name: jira_issue
    method: GET
    path: /rest/api/2/issue/{key}
    effect: read
    preview: key
    description: One issue in full, by key (for example IMIT-1234).
    params:
      - name: key
        in: path
        required: true
        description: The issue key, such as IMIT-1234.
    result:
      line: |
        {key}  {fields.summary}
        status: {fields.status.name}   priority: {fields.priority.name}   type: {fields.issuetype.name}
        reporter: {fields.reporter.displayName}   assignee: {fields.assignee.displayName}
        created: {fields.created}   due: {fields.duedate}
        {fields.description}

  - name: jira_my_open
    method: GET
    path: /rest/api/2/search
    effect: read
    # The presentation rule is IN THE TOOL DESCRIPTION, not only in the skill, and that is
    # deliberate. A skill reaches the prompt as a name and one line; its body arrives only
    # when the model calls skill_view, and asked a plain question like "what is still open"
    # a local model answers straight from the tool result without ever loading it. A tool
    # description, by contrast, is in front of the model every time the tool is.
    description: >
      MY open issues: everything assigned to the configured account that is not done, of
      every issue type -- tasks, bugs, service requests and the rest are all tickets and all
      included. Use this, not jira_search, whenever the question is about the user's own
      work ("which tickets are open for me", "what am I working on"). The account filter is
      fixed and cannot be widened from here.
      Present the result as a Markdown table with exactly these four columns:
      Ticket | Status | Titel | Zusammenfassung.
      Ticket is the [KEY](url) link exactly as returned. Titel is the "title:" part verbatim.
      Zusammenfassung is YOUR OWN one-sentence summary of the "about:" part -- what is
      actually wrong or wanted -- and a dash when there is no "about:" text; never repeat
      the title there. Escape any | inside a cell as \|. No greeting, no invented names.
    params:
      - name: jql
        in: query
        # FIXED, not merely defaulted, and that distinction is the whole point.
        #
        # As a default it was overridable: the model called this tool for "my open tickets"
        # and passed a JQL of its own, and the answer listed everybody's. A parameter the
        # model cannot see is a parameter it cannot replace.
        #
        # currentUser(), which is what the server itself resolves for the authenticated
        # account. I had argued for the configured name instead, on the theory that a proxy
        # could make currentUser() mean somebody else; that was speculation, and the person
        # who runs this installation reported the opposite from experience. It also has a
        # concrete advantage the other form does not: it needs nothing configured, so "my
        # tickets" works the moment the connector has an address and a password.
        #
        # If it ever does resolve to the wrong account, the alternative is the configured
        # name: assignee = "${JIRA_USER}".
        #
        # No issue-type clause on purpose: an open task is a ticket too, and filtering by type
        # is how a list of "my tickets" quietly loses half of them.
        fixed: true
        default: 'assignee = currentUser() AND statusCategory != Done ORDER BY priority DESC, updated DESC'
      - name: maxResults
        in: query
        default: "25"
      - name: fields
        in: query
        # description is fetched, and it costs something, so here is why.
        #
        # summary is the TITLE -- one line, often written by whoever raised the ticket in a
        # hurry ("Drucker geht nicht"). Presented as a summary it tells the reader nothing
        # they could not guess from the key. The description is the body, and one clipped
        # sentence of it is the difference between a list of names and a list you can
        # actually triage from.
        default: "summary,status,priority,duedate,updated,description"
    result:
      items: issues
      total: total
      # title: and about: are labelled on purpose -- unlabelled, the model cannot tell which
      # of two sentences is the headline and puts the wrong one in the wrong column.
      line: "[{key}](${JIRA_URL}/browse/{key})  [{fields.status.name}]  {fields.priority.name}  due {fields.duedate}  title: {fields.summary}  about: {fields.description|220}"
      empty: "nothing is assigned to you that is still open."

  - name: jira_comments
    method: GET
    path: /rest/api/2/issue/{key}/comment
    effect: read
    preview: key
    description: >
      The comments on an issue, newest first. This is where a ticket's actual story is:
      the summary says what it is called, the description says what it was when it was
      raised, and the comments say what has happened since and what anybody is waiting for.
      Reach for this whenever a notification mail about a ticket arrives, or when the
      question is "what is going on with X" rather than "what is X": answering from the
      description alone reports the state of the ticket on the day it was created.
      The text is Wiki markup on this installation, not Markdown.
    params:
      - name: key
        in: path
        required: true
        description: The issue key, such as IMIT-1234.
      - name: orderBy
        in: query
        default: "-created"
        description: Newest first by default. Use "created" for oldest first.
      - name: maxResults
        in: query
        default: "5"
        description: How many comments. Five covers "what is going on"; raise it for a history.
    result:
      items: comments
      total: total
      line: "{created}  {author.displayName}: {body|400}"
      empty: >
        no comments on this issue. That is the answer: nothing has been said on it since it
        was raised, so the description is all there is.

  - name: jira_transitions
    method: GET
    path: /rest/api/2/issue/{key}/transitions
    effect: read
    preview: key
    description: >
      Which status changes this issue allows right now, with the id each one needs.
      Always call this before jira_transition -- the ids differ per workflow.
    params:
      - name: key
        in: path
        required: true
    result:
      items: transitions
      line: "{id}  {name} -> {to.name}"
      empty: "this issue offers no transitions to your account."


  # ---------------------------------------------------------------- writing
  #
  # Everything below asks first, every time. The loader would force that anyway -- only a
  # GET can be silent -- but it is written out here so that reading the file tells the
  # truth about what it does.

  - name: jira_comment
    method: POST
    path: /rest/api/2/issue/{key}/comment
    effect: write
    preview: key
    description: >
      Add a comment to an issue. The text is Wiki markup on this kind of installation,
      not Markdown: *bold*, _italic_, {{code}}, and a list starts with "* ".
    params:
      - name: key
        in: path
        required: true
      - name: body
        in: body
        required: true
        description: The comment text, in Wiki markup.

  - name: jira_transition
    method: POST
    path: /rest/api/2/issue/{key}/transitions
    effect: write
    preview: key
    description: >
      Move an issue to another status. Call jira_transitions first to learn the id; the
      ids are per workflow and guessing one moves the wrong issue to the wrong place.
    params:
      - name: key
        in: path
        required: true
      - name: transitionId
        in: body
        send: transition.id
        required: true
        description: The id from jira_transitions.
      - name: comment
        in: body
        send: update.comment
        description: >
          Optional note to record with the change, as JSON, for example
          [{"add":{"body":"done"}}].

  - name: jira_create
    method: POST
    path: /rest/api/2/issue
    effect: write
    preview: summary
    description: >
      Create an issue. Search for an existing one first -- a duplicate ticket costs
      somebody a merge. Created through the core API rather than the service desk
      request API on purpose: the request API demands the custom fields of a request
      type, while this path needs only project, type, summary and description.
    params:
      - name: project
        in: body
        send: fields.project
        required: true
        default: '{"key":"IMIT"}'
        description: 'The project, as JSON: {"key":"IMIT"}'
      - name: issuetype
        in: body
        send: fields.issuetype
        required: true
        default: '{"name":"Serviceanfrage"}'
        description: >
          The issue type, as JSON. "Serviceanfrage" is the one to use: the alternative
          on this installation demands seven further mandatory fields.
      - name: summary
        in: body
        send: fields.summary
        required: true
        description: The one-line subject.
      - name: description
        in: body
        send: fields.description
        required: true
        description: The body, in Wiki markup.
      - name: priority
        in: body
        send: fields.priority
        description: 'Optional, as JSON: {"name":"Normal"}'

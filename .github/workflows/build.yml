# Compile and run the harnesses on every push. No packaging here.
#
# WHY THIS IS SEPARATE FROM release.yml. Packaging produces two 108 MB files, and doing that
# on every commit spends storage and minutes on an output nobody asked for -- while what a
# push actually needs is fast word on whether the thing still builds and still passes. So the
# gate runs on every push and the packaging runs on a tag.
#
# WHICH HARNESSES. Only the ones that need neither a desktop, an installed Office, a model
# endpoint nor a VPN. The rest are left out on purpose: a runner has no Outlook and no live
# UI, and a suite that fails for want of its environment stops being read.

name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        shell: pwsh
        run: dotnet build Shellvis.slnx -c Release

      # What ships is not what builds. The skills that come with the product are read from
      # beside the executable, so a change to how they are copied would leave an installed
      # Shellvis with no secretary skill and nothing failing anywhere -- the harness has its
      # own copy and would stay green. Publishing is the only place that answers this.
      - name: The shipped skills reach a published build
        shell: pwsh
        run: |
          dotnet publish src/Shellvis.Shell/Shellvis.Shell.csproj -c Release -r win-x64 --self-contained false | Out-Null

          $published = Get-ChildItem -Recurse -Path src/Shellvis.Shell/bin/Release -Filter SKILL.md |
                       Where-Object FullName -like '*publish*skills*'

          if (-not $published) {
            Write-Host "::error title=shipped skills::a published build contains no SKILL.md under skills/"
            exit 1
          }

          Write-Host "$($published.Count) shipped skill(s) in the published output:"
          $published | ForEach-Object { Write-Host "  $($_.FullName)" }

      - name: Verify
        shell: pwsh
        run: |
          $probe = Get-ChildItem -Recurse -Filter Shellvis.DesktopProbe.exe |
                   Where-Object FullName -like '*Release*' |
                   Select-Object -First 1 -ExpandProperty FullName

          if (-not $probe) { throw 'the harness binary was not produced by the build' }

          $failed = @()

          # 'launch' is deliberately absent. It starts real programs and needs a desktop, and
          # it has already been observed to be flaky under automation in this project -- a gate
          # that fails at random teaches people to ignore the gate. 'outlook' and 'officelive'
          # are absent for a plainer reason: they need Office installed and a real mailbox.
          #
          # Everything else runs. Six harnesses had been added without being added here --
          # clarify, markdown, notes, teams, process and agenda -- so a regression in the note
          # database, the Markdown parser or the reminder debounce would have sailed through
          # the gate. A harness that exists and is not gated is a harness that stops being run.
          foreach ($harness in 'classify','config','skills','sessions','compaction',
                               'providers','endpoint','reflect','hooks','cron','thunderbird',
                               'stream','mcp','hass','broker','topmost','speech','whisper',
                               'clarify','markdown','notes','teams','process','agenda') {
            Write-Host "--- $harness"

            # Captured as well as printed, so the reason can be put in an annotation. Run logs
            # need an authenticated download; annotations do not, and a failure nobody can read
            # is a failure nobody can fix.
            $output = & $probe $harness 2>&1 | ForEach-Object { "$_" }
            $output | ForEach-Object { Write-Host $_ }

            if ($LASTEXITCODE -ne 0) {
              $failed += $harness

              $why = ($output | Where-Object { $_ -match 'FAIL|failed|not found|Exception|SKIPPED' } |
                      Select-Object -Last 4) -join ' | '

              if (-not $why) { $why = ($output | Select-Object -Last 3) -join ' | ' }

              Write-Host "::error title=probe $harness::$why"
            }
          }

          if ($failed.Count -gt 0) { throw "harnesses failed: $($failed -join ', ')" }

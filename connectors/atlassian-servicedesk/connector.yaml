# Jira Service Management, the IT service desk.
#
# A connector of its own, because it is a product of its own: separately licensed, its own
# REST namespace (/rest/servicedeskapi beside /rest/api/2), and on a self-hosted estate
# frequently its own host with its own account. Bundling it with Jira called them one thing.
#
# Configure with the variable names a service desk usually already has:
#
#   setx JIRA_SERVICEDESK_URL   https://your-servicedesk-host
#   setx JIRA_SERVICEDESK_USER  your.name
#   ... and the password under JIRA_SERVICEDESK_PASSWORD, or in the secret store.
#
# What is encoded below comes from a working installation rather than from the API reference,
# and the difference matters: every rule here is a failure somebody already had.

name: atlassian-servicedesk
kind: http
title: Jira Service Management
description: >
  The IT service desk: queues, SLA clocks, searching and raising requests. A separate host
  and account from the Jira connector.

baseUrl: ${JIRA_SERVICEDESK_URL}

auth:
  scheme: basic
  userVar: JIRA_SERVICEDESK_USER
  secret: JIRA_SERVICEDESK_PASSWORD

tools:
  # ------------------------------------------------------------- the queues

  - name: servicedesk_queues
    method: GET
    path: /rest/servicedeskapi/queues/{projectKey}
    effect: read
    preview: projectKey
    description: The service desk queues of a project, with how many issues each holds.
    headers:
      # The queue API is behind an opt-in header. Without it the server answers 404, which
      # reads as "no such project" rather than "you forgot a header".
      X-ExperimentalApi: "true"
    params:
      - name: projectKey
        in: path
        required: true
        default: IMIT
        description: The project key. IMIT is the service desk project on this installation.
    result:
      items: values
      total: size
      line: "{id}  {name}  ({issueCount} issues)"
      empty: >
        this project has no service desk queues, or the account cannot see them. A project
        without Jira Service Management enabled answers this way.

  - name: servicedesk_queue_issues
    method: GET
    path: /rest/servicedeskapi/queues/{projectKey}/{queueId}/issue
    effect: read
    preview: queueId
    description: The issues waiting in one queue. Get the queue id from servicedesk_queues.
    headers:
      X-ExperimentalApi: "true"
    params:
      - name: projectKey
        in: path
        required: true
        default: IMIT
      - name: queueId
        in: path
        required: true
      - name: limit
        in: query
        default: "25"
    result:
      items: values
      total: size
      line: "[{key}](${JIRA_SERVICEDESK_URL}/browse/{key})  [{fields.status.name}]  {fields.summary}"
      empty: "this queue is empty."

  - name: servicedesk_sla
    method: GET
    path: /rest/servicedeskapi/request/{key}/sla
    effect: read
    preview: key
    description: >
      The SLA clocks on one request: what is running, what has breached, and when the next
      deadline falls. This answers "what runs out today", which is the question behind most
      requests about the service desk even when nobody phrases it that way. Say a breach
      first, before anything else about the ticket.
    params:
      - name: key
        in: path
        required: true
        description: The request key, such as IMIT-1234.
    result:
      items: values
      line: "{name}: {ongoingCycle.remainingTime.friendly} remaining, breached={ongoingCycle.breached}, due {ongoingCycle.breachTime.friendly}"
      empty: "this request carries no SLA, or it is already closed."

  # ----------------------------------------------------------- the requests
  #
  # Through the CORE issue API (/rest/api/2) and not through /rest/servicedeskapi/request.
  # The request API demands the custom fields of a request type, which is a wall; the core
  # API on the same host needs only project, type, summary and description. Learned the hard
  # way on this installation, and the reason is written here so nobody re-learns it.

  - name: servicedesk_search
    method: GET
    path: /rest/api/2/search
    effect: read
    preview: jql
    description: >
      Search service desk tickets with JQL. Two rules from real failures here: use
      "statusCategory != Done" rather than a status name, because the names are localised and
      change per workflow; and use "summary ~ text" rather than "summary = text", because a
      colon in a subject makes an "=" comparison a JQL 400.
    params:
      - name: jql
        in: query
        required: true
        description: 'For example: project = "IMIT" AND statusCategory != Done'
      - name: maxResults
        in: query
        default: "25"
      - name: fields
        in: query
        default: "summary,status,priority,assignee,created,updated,description"
    result:
      items: issues
      total: total
      line: "[{key}](${JIRA_SERVICEDESK_URL}/browse/{key})  [{fields.status.name}]  {fields.priority.name}  ({fields.assignee.displayName})  title: {fields.summary}  about: {fields.description|220}"
      empty: >
        no tickets match that JQL. That is the answer. If a match was expected, remember that
        status names are localised: use statusCategory != Done.

  - name: servicedesk_my_open
    method: GET
    path: /rest/api/2/search
    effect: read
    description: >
      MY open service desk tickets: everything assigned to the configured account that is not
      done, of every type. An open task is a ticket too. Use this rather than
      servicedesk_search when the question is about the user's own work; the account filter is
      fixed and cannot be widened from here.
      Present the result as a Markdown table with exactly these four columns:
      Ticket | Status | Titel | Zusammenfassung -- the same shape as the Jira list, under its
      own heading, because the two are separate products and mixing them into one table hides
      which system a ticket is in.
      Ticket is the [KEY](url) link exactly as returned. Titel is the "title:" part verbatim.
      Zusammenfassung is YOUR OWN one-sentence summary of the "about:" part, and a dash when
      there is no "about:" text; never repeat the title there. Escape any | inside a cell as
      \|. No greeting, no invented names.
    params:
      - name: jql
        in: query
        # FIXED rather than defaulted: a default is overridable, and an overridden "my
        # tickets" filter answers with everybody's. currentUser() for the same reason as in
        # the Jira connector -- the server resolves it for the authenticated account, and it
        # needs nothing configured beyond the password that is already required.
        fixed: true
        default: 'assignee = currentUser() AND statusCategory != Done ORDER BY priority DESC, updated DESC'
      - name: maxResults
        in: query
        default: "25"
      - name: fields
        in: query
        default: "summary,status,priority,duedate,updated,description"
    result:
      items: issues
      total: total
      line: "[{key}](${JIRA_SERVICEDESK_URL}/browse/{key})  [{fields.status.name}]  {fields.priority.name}  title: {fields.summary}  about: {fields.description|220}"
      empty: "nothing on the service desk is assigned to you and still open."

  - name: servicedesk_issue
    method: GET
    path: /rest/api/2/issue/{key}
    effect: read
    preview: key
    description: One service desk ticket in full, by key.
    params:
      - name: key
        in: path
        required: true
    result:
      line: |
        {key}  {fields.summary}
        status: {fields.status.name}   priority: {fields.priority.name}   type: {fields.issuetype.name}
        reporter: {fields.reporter.displayName}   assignee: {fields.assignee.displayName}
        created: {fields.created}
        {fields.description}

  - name: servicedesk_comments
    method: GET
    path: /rest/api/2/issue/{key}/comment
    effect: read
    preview: key
    description: >
      The comments on a service desk ticket, newest first. On a service desk this matters
      more than anywhere else: the ticket text is what the customer wrote once, and everything
      since -- what was tried, what is being waited for, whether it is with the customer or
      with us -- is in the comments. A notification mail about a ticket is a reason to read
      these rather than to answer from the mail, which is mostly template.
      Note that this reads BOTH public and internal comments, so treat anything here as
      internal unless the ticket says otherwise.
    params:
      - name: key
        in: path
        required: true
      - name: orderBy
        in: query
        default: "-created"
      - name: maxResults
        in: query
        default: "5"
    result:
      items: comments
      total: total
      line: "{created}  {author.displayName}: {body|400}"
      empty: >
        no comments on this ticket. Nothing has been said on it since it was raised.

  - name: servicedesk_comment
    method: POST
    path: /rest/api/2/issue/{key}/comment
    effect: write
    preview: key
    description: >
      Add a comment to a ticket. Wiki markup, not Markdown: *bold*, _italic_, {{code}},
      "* " for a list item, "----" for a rule.
    params:
      - name: key
        in: path
        required: true
      - name: body
        in: body
        required: true
        description: The comment text, in Wiki markup.

  - name: servicedesk_create
    method: POST
    path: /rest/api/2/issue
    effect: write
    preview: summary
    description: >
      Raise a service desk ticket. SEARCH FIRST, every time: run servicedesk_search for the
      same host and service with statusCategory != Done, and if an open ticket exists, say so
      and ask rather than raising a second one. A duplicate costs somebody a merge and splits
      the conversation across two tickets.
      Use the issue type "Serviceanfrage". The alternative on this installation,
      "IT Supportanfrage", demands seven further mandatory custom fields and fails with a
      field id rather than a name.
    params:
      - name: project
        in: body
        send: fields.project
        required: true
        default: '{"key":"IMIT"}'
        description: 'The project, as JSON: {"key":"IMIT"}'
      - name: issuetype
        in: body
        send: fields.issuetype
        required: true
        default: '{"name":"Serviceanfrage"}'
        description: >
          As JSON. Keep "Serviceanfrage" unless the user asks otherwise; see the description
          above for why the other type is a wall.
      - name: summary
        in: body
        send: fields.summary
        required: true
        description: >
          The one-line subject. For an alert, the convention on this installation is
          "SEVERITY: hostname - service name", which is also what the duplicate search
          matches on.
      - name: description
        in: body
        send: fields.description
        required: true
        description: The body, in Wiki markup.
      - name: priority
        in: body
        send: fields.priority
        description: >
          As JSON, one of Kritisch, Hoch, Normal, Niedrig. Kritisch is an outage or data
          loss, Hoch a significant degradation, Normal needs action without immediate
          danger, Niedrig is informational. Omit it and the project default applies; do not
          raise a priority on your own judgement.

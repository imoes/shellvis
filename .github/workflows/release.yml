# Builds both installers and attaches them to a GitHub Release.
#
# WHY A WORKFLOW AND NOT A COMMITTED FILE. Each MSI is about 105 MB, almost all of it the
# PowerShell SDK, and GitHub refuses any single file over 100 MB on push -- a hard limit,
# not a warning. So the installers cannot live in the repository at all, and the place for
# a build output is a release asset anyway: it is tied to a tag, it is downloadable without
# a clone, and it does not sit in everyone's working copy for ever.
#
# The version comes out of Directory.Build.props rather than the tag, so the number in the
# package, in the file name and in the application can never disagree. A tag that does not
# match is a mistake worth failing on rather than papering over.

name: release

on:
  push:
    tags: ['v*']
  # Also runnable by hand, so the packaging can be exercised without cutting a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installers:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $props = [xml](Get-Content Directory.Build.props)
          $version = $props.Project.PropertyGroup.VersionPrefix.Trim()

          if (-not $version) { throw 'no VersionPrefix in Directory.Build.props' }

          # A tag that disagrees with the build is a mistake, not something to reconcile
          # silently: whichever one is wrong, shipping a package labelled with the other
          # makes the version useless for identifying a build.
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF -replace '^refs/tags/v?', ''
            if ($tag -ne $version) {
              throw "tag $tag does not match VersionPrefix $version"
            }
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "building $version"

      - name: Build and test
        shell: pwsh
        run: |
          dotnet build Shellvis.slnx -c Release
          dotnet build tools/Shellvis.DesktopProbe -c Release

      # The harnesses that need neither a desktop, a model endpoint nor Office. The rest are
      # deliberately left out: a runner has no Outlook, no live UI and no VPN, and a suite
      # that fails for want of the environment teaches nobody anything.
      #
      # 'launch' is absent for a different reason: it starts real programs, and it has already
      # been observed flaky under automation here. A release gate that fails at random is a
      # gate people learn to re-run rather than read.
      - name: Verify
        shell: pwsh
        run: |
          $probe = Get-ChildItem -Recurse -Filter Shellvis.DesktopProbe.exe |
                   Where-Object FullName -like '*Release*' |
                   Select-Object -First 1 -ExpandProperty FullName

          if (-not $probe) { throw 'the harness binary was not produced by the build' }

          $failed = @()

          foreach ($harness in 'classify','config','skills','sessions','compaction',
                               'providers','endpoint','reflect','hooks','cron','thunderbird',
                               'stream','mcp','hass','broker','topmost','speech','whisper','connectors','notify','schedule') {
            Write-Host "--- $harness"

            # Captured as well as printed, so the reason survives into an annotation: run logs
            # need an authenticated download, annotations do not.
            $output = & $probe $harness 2>&1 | ForEach-Object { "$_" }
            $output | ForEach-Object { Write-Host $_ }

            if ($LASTEXITCODE -ne 0) {
              $failed += $harness

              $why = ($output | Where-Object { $_ -match 'FAIL|failed|not found|Exception|SKIPPED' } |
                      Select-Object -Last 4) -join ' | '

              if (-not $why) { $why = ($output | Select-Object -Last 3) -join ' | ' }

              Write-Host "::error title=probe $harness::$why"
            }
          }

          if ($failed.Count -gt 0) { throw "harnesses failed: $($failed -join ', ')" }

      - name: Stage
        shell: pwsh
        run: |
          $stage = 'artifacts/stage'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # All four into ONE folder: that is the layout the application and the console
          # installer both assume, and shared dependencies simply overwrite each other.
          foreach ($project in 'src/Shellvis.Shell/Shellvis.Shell.csproj',
                               'src/Shellvis.Broker/Shellvis.Broker.csproj',
                               'src/Shellvis.Setup/Shellvis.Setup.csproj',
                               'src/Shellvis.Thunderbird.Host/Shellvis.Thunderbird.Host.csproj') {
            dotnet publish $project -c Release -r win-x64 --self-contained false -o $stage
            if ($LASTEXITCODE -ne 0) { throw "publish failed: $project" }
          }

      # Signed BEFORE packaging, because the files inside the .msi are what Windows checks
      # when they are launched. Signing only the package would leave every executable it
      # installs unsigned, which is the state that gets them blocked.
      #
      # Nothing is configured in the public repository, and that is deliberate rather than an
      # omission: the step reports the files as unsigned and the build goes on. -Require is
      # passed only when a certificate actually is configured, so a pipeline that MEANS to
      # sign fails loudly instead of shipping a package that only looks signed.
      - name: Sign the binaries
        shell: pwsh
        env:
          SHELLVIS_SIGN_THUMBPRINT: ${{ secrets.SIGN_THUMBPRINT }}
          SHELLVIS_SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SHELLVIS_SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          # A .pfx arrives as a secret, which cannot be a file. Written next to the runner's
          # temp rather than into the staging folder, so it cannot end up inside the package.
          if ($env:SHELLVIS_SIGN_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SHELLVIS_SIGN_PFX_BASE64))
            $env:SHELLVIS_SIGN_PFX = $pfx
          }

          $configured = [bool]$env:SHELLVIS_SIGN_THUMBPRINT -or [bool]$env:SHELLVIS_SIGN_PFX

          ./install/Sign.ps1 -Require:$configured -Path @(
            'artifacts/stage/Shellvis.Shell.exe'
            'artifacts/stage/Shellvis.Broker.exe'
            'artifacts/stage/Shellvis.Setup.exe'
            'artifacts/stage/Shellvis.Thunderbird.Host.exe'
          )

          if ($LASTEXITCODE -ne 0) { throw 'signing the binaries failed' }

      - name: Package
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.*
          wix extension add -g WixToolset.UI.wixext/5.0.2

          $version = '${{ steps.version.outputs.version }}'
          $stage = Join-Path $PWD 'artifacts/stage'
          $bind = Join-Path $PWD 'install'
          # ONE package. It carries both scopes: Scope="perUserOrMachine" puts ALLUSERS=2 and
          # MSIINSTALLPERUSER in it, and a page in the installer sets the switch. There is no
          # -d PerUser switch any more, and no second build to drift from the first.
          wix build install/Shellvis.wxs -arch x64 -d Version=$version -d Stage=$stage `
              -bindpath $bind -ext WixToolset.UI.wixext `
              -o "artifacts/Shellvis-$version.msi"
          if ($LASTEXITCODE -ne 0) { throw 'package failed' }

          # A size floor, because wix succeeds on a package with nothing in it. If the staging
          # step ever produced an empty folder the build would go green and ship a 200 KB
          # installer that installs nothing, and the failure would surface at a user's machine
          # rather than here. The package is around 108 MB, almost all of it the PowerShell
          # SDK; fifty is far below that and far above an empty one.
          foreach ($msi in Get-ChildItem artifacts/*.msi) {
            $mb = [math]::Round($msi.Length / 1MB, 1)
            Write-Host ('{0}  {1} MB' -f $msi.Name, $mb)

            if ($mb -lt 50) { throw "$($msi.Name) is only $mb MB; the payload is missing" }
          }

          if ((Get-ChildItem artifacts/*.msi).Count -ne 1) { throw 'expected exactly one package' }

      # And the package itself, after building it. Both are needed: the signature on the .msi
      # is what a user sees in the UAC prompt and what SmartScreen weighs before they run it,
      # and the signatures inside are what Windows checks every time the application starts.
      - name: Sign the package
        shell: pwsh
        env:
          SHELLVIS_SIGN_THUMBPRINT: ${{ secrets.SIGN_THUMBPRINT }}
          SHELLVIS_SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SHELLVIS_SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          if ($env:SHELLVIS_SIGN_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SHELLVIS_SIGN_PFX_BASE64))
            $env:SHELLVIS_SIGN_PFX = $pfx
          }

          $configured = [bool]$env:SHELLVIS_SIGN_THUMBPRINT -or [bool]$env:SHELLVIS_SIGN_PFX

          ./install/Sign.ps1 -Require:$configured -Path 'artifacts/*.msi'
          if ($LASTEXITCODE -ne 0) { throw 'signing the package failed' }

          # Said out loud in the log either way, because "was this release signed" is a
          # question somebody will ask about a build nobody can re-run.
          foreach ($msi in Get-ChildItem artifacts/*.msi) {
            $s = Get-AuthenticodeSignature $msi.FullName
            Write-Host ('{0}: {1} {2}' -f $msi.Name, $s.Status, $s.SignerCertificate.Subject)
          }
          if ((Get-ChildItem artifacts/*.msi).Count -ne 2) { throw 'expected two packages' }

      # Kept for a manual run too, where there is no release to attach them to. Short
      # retention: on a tag the release assets are the permanent copy, and this one is only
      # useful while somebody is looking at the run that produced it.
      - uses: actions/upload-artifact@v4
        with:
          name: installers
          path: artifacts/*.msi
          if-no-files-found: error
          retention-days: 14

      # The notes live in a YAML block and reach gh through a file.
      #
      # NOT a PowerShell here-string, which is what this was and why the whole workflow was
      # unparseable: a here-string has to be closed by "@ in COLUMN ZERO, and column zero is
      # exactly where a YAML block scalar ends. The notes therefore fell out of the run: block
      # and into the top level of the document. GitHub's answer to an unparseable workflow is
      # to not run it, with the reason visible only in the Actions tab -- so this was caught by
      # parsing the file locally rather than by pushing it and waiting.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: |
            One installer, and it asks who the installation is for:

            - **Just for me** installs into `%LOCALAPPDATA%\Programs\Shellvis`. No
              administrator rights, no broker service; the tools that need elevation report
              as unavailable.
            - **For everyone on this machine** installs into `%ProgramFiles%\Shellvis` and
              offers the privileged broker service as a selectable feature. Needs
              administrator rights once.

            **On a managed desktop, choose "for everyone"** even if you do not want the
            service. Defender's rule against low-prevalence executables refuses an unsigned
            binary under a user-writable path, and `%LOCALAPPDATA%` is one; `%ProgramFiles%`
            is not. The binaries are not signed yet.

            This used to be two packages, on the belief that Windows Installer fixes the
            scope at build time. It does not: MSI 4.5 single package authoring covers both,
            which is what this package now uses.

            Dictation downloads its speech model on first use; the installer asks which one.
            Requires the Windows App Runtime 2.4.0, and Office for the Office and Outlook
            tools. See the README for what is verified and what is not.
        run: |
          $env:NOTES | Set-Content release-notes.md -Encoding utf8

          # gh ships on the runner, so this needs no action and no extra token.
          gh release create $env:GITHUB_REF_NAME (Get-Item artifacts/*.msi).FullName `
             --title "Shellvis $env:VERSION" `
             --notes-file release-notes.md

          if ($LASTEXITCODE -ne 0) { throw 'the release could not be created' }
